name: thebitstoday
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: thebitstoday
      POSTGRES_USER: thebitstoday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thebitstoday -d thebitstoday"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    networks: [private]
  api:
    build:
      context: ../..
      dockerfile: deploy/website/Dockerfile.api
    restart: unless-stopped
    environment:
      CONTENT_DATABASE_URL: postgresql://thebitstoday:${POSTGRES_PASSWORD}@db:5432/thebitstoday
      CONTENT_API_KEY: ${CONTENT_API_KEY:?Set CONTENT_API_KEY}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:?Set R2_ENDPOINT_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?Set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?Set R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:?Set R2_BUCKET}
    ports: ["127.0.0.1:18501:8001"]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 768m
    networks: [private]
  web:
    build:
      context: ../..
      dockerfile: deploy/website/Dockerfile.web
    restart: unless-stopped
    ports: ["127.0.0.1:18573:80"]
    depends_on:
      api: {condition: service_healthy}
    volumes:
      - ./acme:/var/www/acme:ro
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik-shared
      traefik.http.routers.thebitstoday.rule: Host(`thebitstoday.com`) || Host(`www.thebitstoday.com`)
      traefik.http.routers.thebitstoday.entrypoints: websecure
      traefik.http.routers.thebitstoday.tls: "true"
      traefik.http.services.thebitstoday.loadbalancer.server.port: "80"
    mem_limit: 96m
    networks: [private, proxy]
networks:
  private:
  proxy:
    external: true
    name: traefik-shared
volumes:
  postgres:
